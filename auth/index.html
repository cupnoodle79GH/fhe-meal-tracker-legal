<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF9F4">
  <title>Email confirmed · FHE's Meal Tracker</title>
  <style>
    body{margin:0;background:#fff9f4;color:#29423a;font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:560px;margin:0 auto;padding:64px 24px}section{background:#fff;border:1px solid #eae4dd;border-radius:24px;padding:28px}
    .mark{width:58px;height:58px;border-radius:20px;background:#bfe5d1;display:grid;place-items:center;font-size:30px}h1{line-height:1.15;margin:20px 0 10px}
    a{display:block;margin-top:24px;padding:14px 18px;border-radius:14px;background:#29423a;color:#fff;text-align:center;font-weight:800;text-decoration:none}
    small{display:block;margin-top:18px;color:#718079}.error{background:#fff3f3;border-color:#b45d64}
  </style>
</head>
<body><main><section id="card"><div class="mark" id="mark">✓</div><h1 id="title">Email confirmed</h1><p id="message">Your email address is confirmed. Open FHE's Meal Tracker on your iPhone to continue.</p><a id="open" href="#">Open FHE's Meal Tracker</a><small id="help">If you are using a computer, you can close this page and sign in on your iPhone.</small></section></main>
<script>
  (function(){
    var params=new URLSearchParams(location.search), hash=new URLSearchParams(location.hash.replace(/^#/,''));
    var error=params.get('error_description')||params.get('error')||hash.get('error_description')||hash.get('error');
    var suffix=location.search+location.hash;
    var open=document.getElementById('open'), card=document.getElementById('card');
    if(error){
      card.className='error'; document.getElementById('mark').textContent='!'; document.getElementById('title').textContent='Confirmation link unavailable';
      document.getElementById('message').textContent=decodeURIComponent(String(error).replace(/\+/g,' '))+'. Return to FHE\'s Meal Tracker and request a new confirmation email.';
      open.textContent='Return to FHE\'s Meal Tracker';
    }
    open.href='fhesmealtracker://auth/callback'+suffix;
  }());
</script></body>
</html>
